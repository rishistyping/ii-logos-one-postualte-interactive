name = "op-postulate-chat"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

[vars]
BEDROCK_REGION = "us-east-1"
BEDROCK_MODEL_ID = "us.anthropic.claude-sonnet-4-6"
BEDROCK_LATENCY = "optimized"

# The Bedrock bearer token is provided as a secret, NOT here.
# ANTHROPIC_API_KEY is still accepted as a legacy secret name by the Worker,
# but AWS_BEARER_TOKEN_BEDROCK is preferred for new deploys.
# Run after `wrangler login`:
#   wrangler secret put AWS_BEARER_TOKEN_BEDROCK
# (paste the Bedrock bearer token when prompted; never commit it.)
